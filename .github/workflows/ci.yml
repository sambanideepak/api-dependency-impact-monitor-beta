name: UpstreamSentry CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege: read-only contents, no write tokens, no secrets.
permissions:
  contents: read

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install only dependency (PyYAML, MIT)
        run: pip install pyyaml pytest

      - name: Run unit tests (generic, no vendor source)
        run: python -m pytest tests/ -q

      - name: Run one-command beta scan on bundled demo (read-only safety)
        run: |
          bash run_beta_scan.sh \
            --repo ./demo-app \
            --old-spec ./demo-api/openapi-old.yaml \
            --new-spec ./demo-api/openapi-new.yaml \
            --output ./beta-report

      - name: Assert read-only (demo repo must be unchanged)
        run: |
          python - <<'PY'
          from pathlib import Path
          from github_mvp.pipeline import fingerprint_repo, compare_fingerprints, ImpactPipeline
          repo = Path('./demo-app').resolve()
          before = fingerprint_repo(repo)
          pipe = ImpactPipeline(repo, Path('./demo-api/openapi-old.yaml').resolve(), Path('./demo-api/openapi-new.yaml').resolve())
          res = pipe.run()
          after = fingerprint_repo(repo)
          d = compare_fingerprints(before, after)
          assert not d['changed'] and not d['added'] and not d['removed'], "repo mutated!"
          assert res.safety.get('read_only'), "read_only False"
          print("READ-ONLY SAFETY OK")
          PY

      - name: Assert no network/telemetry in analysis path
        run: |
          ! grep -rEn "requests\.|urllib\.request|httpx|socket\.connect|telemetry|beacon" github_mvp/ semantic_impact_mapper.py | grep -v "safe_clone" | grep -v "__pycache__"

  real-world-fail-closed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout UpstreamSentry
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependency
        run: pip install pyyaml

      - name: Materialize frozen EvalView BEFORE and AFTER revisions
        run: |
          git clone --quiet https://github.com/hidai25/eval-view.git /tmp/eval-view-before
          git -C /tmp/eval-view-before checkout --quiet afbc7f6c715d7cd1ab1ea71aefd5e26a9bbcd767
          git clone --quiet https://github.com/hidai25/eval-view.git /tmp/eval-view-after
          git -C /tmp/eval-view-after checkout --quiet 27f7bc019cd3d41184411fc3802494f97a0c58e7

      - name: Run real-world fail-closed audit
        run: |
          python run_migration_audit.py \
            --before-repo /tmp/eval-view-before \
            --after-repo /tmp/eval-view-after \
            --old-spec real_world_cases/eval_view_openai_assistants/openapi-old.yaml \
            --new-spec real_world_cases/eval_view_openai_assistants/openapi-new.yaml \
            --output /tmp/eval-view-audit

      - name: Assert honest REVIEW coverage-boundary decision
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('/tmp/eval-view-audit/migration-audit.json').read_text())
          assert payload['decision'] == 'REVIEW', payload['decision']
          before = payload['before_scan']
          after = payload['after_scan']
          assert len(before['breaking_changes']) > 0, 'fixture did not produce a breaking contract change'
          assert len(before['impacts']) == 0, 'SDK-symbol migration unexpectedly mapped; re-evaluate expected case'
          assert before['safety']['read_only'] is True
          assert after['safety']['read_only'] is True
          notes = ' '.join(payload.get('notes', [])).lower()
          assert 'no baseline consumer impacts' in notes
          print('REAL-WORLD FAIL-CLOSED PROOF OK: REVIEW, NO FALSE PASS')
          PY
